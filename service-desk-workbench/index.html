<style>
/* ==========================================================================
   Service Desk Workbench: design system
   Tokens > base > layout > components > views. Dark is the default; light follows
   the OS in "auto" or when chosen. No external fonts or assets (offline, CSP-safe).
   ========================================================================== */
:root {
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "SF Mono", ui-monospace, Consolas, Menlo, monospace;

  --bg: #0a0e17;
  --bg-glow: rgba(91, 140, 255, .14);
  --surface: #111827;
  --surface-2: #161f31;
  --surface-3: #1c2740;
  --border: #223049;
  --border-strong: #30415f;
  --text: #e9eefa;
  --text-2: #a4b1c9;
  --text-3: #7a8aa6;
  --accent: #6b95ff;
  --accent-2: #8b7bff;
  --accent-soft: rgba(107, 149, 255, .14);
  --on-accent: #0a1020;
  --good: #3fd6a0;
  --good-soft: rgba(63, 214, 160, .14);
  --warn: #f6b94e;
  --warn-soft: rgba(246, 185, 78, .13);
  --bad: #ff7a85;
  --bad-soft: rgba(255, 122, 133, .13);
  --code: #0b111d;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
  --shadow-md: 0 8px 28px rgba(0, 0, 0, .38);
  --ring: 0 0 0 3px rgba(107, 149, 255, .38);
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}

/* light palette: explicit light, and "auto" on a light OS */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f6fc; --bg-glow: rgba(70, 110, 240, .10);
  --surface: #ffffff; --surface-2: #f6f8fd; --surface-3: #ecf0f9;
  --border: #e2e8f4; --border-strong: #cdd7ea;
  --text: #0f172a; --text-2: #475775; --text-3: #5f7090;
  --accent: #3454e8; --accent-2: #6a4df0; --accent-soft: rgba(52, 84, 232, .10); --on-accent: #ffffff;
  --good: #087a55; --good-soft: rgba(8, 122, 85, .11);
  --warn: #8f5f10; --warn-soft: rgba(143, 95, 16, .12);
  --bad: #d23f4d; --bad-soft: rgba(210, 63, 77, .10);
  --code: #f4f7fd;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06); --shadow-md: 0 10px 30px rgba(15, 23, 42, .12);
  --ring: 0 0 0 3px rgba(58, 99, 240, .28);
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    color-scheme: light;
    --bg: #f3f6fc; --bg-glow: rgba(70, 110, 240, .10);
    --surface: #ffffff; --surface-2: #f6f8fd; --surface-3: #ecf0f9;
    --border: #e2e8f4; --border-strong: #cdd7ea;
    --text: #0f172a; --text-2: #475775; --text-3: #5f7090;
    --accent: #3454e8; --accent-2: #6a4df0; --accent-soft: rgba(52, 84, 232, .10); --on-accent: #ffffff;
    --good: #087a55; --good-soft: rgba(8, 122, 85, .11);
    --warn: #8f5f10; --warn-soft: rgba(143, 95, 16, .12);
    --bad: #d23f4d; --bad-soft: rgba(210, 63, 77, .10);
    --code: #f4f7fd;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06); --shadow-md: 0 10px 30px rgba(15, 23, 42, .12);
    --ring: 0 0 0 3px rgba(58, 99, 240, .28);
  }
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14.5px/1.5 var(--font); color: var(--text); letter-spacing: -.003em;
  background: radial-gradient(900px 420px at 72% -8%, var(--bg-glow), transparent 62%), var(--bg);
  display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; letter-spacing: -.015em; }
h2 { font-size: 20px; line-height: 1.25; font-weight: 700; }
h3 { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin: 22px 0 10px; }
p { margin: 0 0 10px; }
.muted { color: var(--text-2); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.hidden { display: none !important; }
.sr { position: absolute; left: -9999px; }
.bad { color: var(--bad); }
a { color: var(--accent); }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--ring); }
::selection { background: var(--accent-soft); }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
kbd, .kbd { font: 600 11px/1 var(--mono); color: var(--text-3); background: var(--surface-2); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; padding: 3px 6px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 7px 14px;
  font: 600 13.5px/1 var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-md); cursor: pointer; transition: background .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease), box-shadow .15s var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px); }
.btn.primary { color: var(--on-accent); border-color: transparent; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 14px rgba(107, 149, 255, .28); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ok { color: var(--good); border-color: var(--good); background: var(--good-soft); }
.btn.sm { min-height: 30px; padding: 5px 10px; font-size: 12.5px; border-radius: var(--r-sm); }
.btn.link { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.link:hover { color: var(--text); background: var(--surface-2); }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.btn[disabled] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn.block { width: 100%; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.iconbtn { flex: none; display: inline-grid; place-items: center; width: 38px; height: 38px; color: var(--text-2); background: transparent; border: 1px solid transparent; border-radius: 10px; cursor: pointer; transition: background .15s, color .15s; }
.iconbtn:hover { background: var(--surface-2); color: var(--text); }

/* segmented controls (validation / outcome) */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; }
.seg .btn { min-height: 32px; border-color: transparent; background: transparent; border-radius: 9px; color: var(--text-2); }
.seg .btn:hover { background: var(--surface-3); color: var(--text); }
.seg .btn[aria-pressed="true"] { background: var(--surface); color: var(--text); border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.seg .btn.good[aria-pressed="true"] { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.seg .btn.bad[aria-pressed="true"] { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.seg .btn.on[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ---------- inputs ---------- */
input[type=text], input[type=search], textarea {
  width: 100%; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; font: inherit;
  transition: border-color .15s, box-shadow .15s;
}
input[type=text]:focus, textarea:focus { border-color: var(--accent); box-shadow: var(--ring); }
textarea { resize: vertical; min-height: 84px; }
textarea.mono { font: 12.5px/1.55 var(--mono); min-height: 200px; }
::placeholder { color: var(--text-3); }
input[type=checkbox] { accent-color: var(--accent); width: 17px; height: 17px; margin: 0; flex: none; }

/* ---------- cards & surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
.card > h2:first-child { margin-bottom: 4px; }
.infobox { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px; margin: 10px 0; font-size: 13.5px; }
.infobox ul { margin: 6px 0 0 18px; padding: 0; }
.warnbox { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn); border-radius: var(--r-md); padding: 9px 12px; margin: 0 0 10px; font-size: 13px; }
.panel { border: 1px solid var(--border); background: var(--surface-2); border-radius: var(--r-md); padding: 14px 16px; margin-top: 16px; }
.panel h3 { margin-top: 0; }
.panel.ai { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); background: linear-gradient(180deg, var(--accent-soft), transparent 60%), var(--surface-2); }
.pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); margin-left: 6px; vertical-align: middle; }
.pill.auto { background: var(--warn-soft); color: var(--warn); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); margin: 0 6px 6px 0; }
.chip.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: var(--good-soft); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); }
.chips { display: flex; flex-wrap: wrap; }
.bar { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius: 999px; transition: width .35s var(--ease); }
.bar.sm { height: 5px; }

/* ---------- top bar ---------- */
#top { flex: none; position: relative; z-index: 20; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 14px; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: -.02em; font-size: 15.5px; white-space: nowrap; }
.brand svg { flex: none; filter: drop-shadow(0 3px 8px rgba(107, 149, 255, .35)); }
.searchbox { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; max-width: 760px; margin: 0 auto; }
.searchbox > svg { position: absolute; left: 14px; color: var(--text-3); pointer-events: none; }
.searchbox input { padding: 11px 44px 11px 42px; font-size: 15px; border-radius: 999px; background: var(--surface-2); }
.searchbox .kbd { position: absolute; right: 14px; pointer-events: none; }
.clearbtn { position: absolute; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; color: var(--text-3); background: var(--surface-3); border: 0; border-radius: 999px; cursor: pointer; }
.clearbtn:hover { color: var(--text); }
.menu { position: absolute; right: 12px; top: calc(100% + 6px); min-width: 230px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; padding: 6px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; animation: pop .14s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
.menuitem { display: flex; align-items: center; gap: 10px; text-align: left; color: var(--text); background: transparent; border: 0; padding: 10px 12px; border-radius: 9px; cursor: pointer; font: 500 14px var(--font); }
.menuitem svg { color: var(--text-3); }
.menuitem:hover, .menuitem[aria-current="page"] { background: var(--surface-2); }
.menusep { height: 1px; background: var(--border); margin: 6px 4px; }

/* ---------- tabs (open checklists) ---------- */
#tabs { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 14px 0; overflow-x: auto; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.tab { display: flex; align-items: center; flex: none; max-width: 240px; border: 1px solid var(--border); border-bottom: 0; border-radius: 10px 10px 0 0; background: var(--surface-2); color: var(--text-2); }
.tab.on { background: var(--bg); color: var(--text); border-color: var(--border-strong); box-shadow: inset 0 2px 0 var(--accent); }
.tabmain { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 6px 8px 12px; background: transparent; border: 0; color: inherit; font: 600 13px var(--font); cursor: pointer; }
.tabtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabprog { font: 600 11px var(--mono); color: var(--text-3); }
.tab.on .tabprog { color: var(--accent); }
.tabx { display: grid; place-items: center; width: 24px; height: 24px; margin-right: 6px; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); cursor: pointer; }
.tabx:hover { background: var(--surface-3); color: var(--text); }
.tabnew { display: grid; place-items: center; flex: none; width: 30px; height: 30px; margin: 0 0 4px 2px; border: 1px dashed var(--border-strong); border-radius: 8px; background: transparent; color: var(--text-3); cursor: pointer; }
.tabnew:hover { color: var(--accent); border-color: var(--accent); }

/* ---------- app shell + panes ---------- */
#app { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.scroll { height: 100%; overflow: auto; padding: 18px 14px 40px; }
.scroll > * { max-width: 980px; margin-left: auto; margin-right: auto; }
.storebanner { margin: 10px 14px 0; }
.stage { position: absolute; inset: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); }
.pane { overflow-y: auto; overflow-x: hidden; min-width: 0; padding: 14px 16px 24px; }
.pane.list { border-right: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 35%, transparent); }
/* wide: the right pane is always visible (empty state, or the checklist fading in). Narrow: it slides in, see the media query. */
.rundetail.anim .detailgrid { animation: rise .26s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- results ---------- */
.hint { color: var(--text-3); font-size: 12.5px; font-weight: 600; margin: 2px 2px 10px; }
.results { display: grid; gap: 8px; align-content: start; }
.result { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%; text-align: left; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px 12px 16px; cursor: pointer; font: inherit; box-shadow: var(--shadow-sm); transition: transform .15s var(--ease), border-color .15s, background .15s, box-shadow .15s; }
.result:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.result b { font-size: 14.5px; letter-spacing: -.01em; }
.result.cur { border-color: var(--accent); }
.result.open { border-color: var(--accent); background: var(--accent-soft); }
.result::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: transparent; }
.result.open::before, .result.cur::before { background: var(--accent); }
.result .best { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; margin-bottom: 3px; }
.result .why { color: var(--good); font-weight: 500; }
.sysrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.sysrow .pill { margin: 0; }

.placeholder { display: grid; place-items: center; align-content: center; text-align: center; min-height: min(72vh, 620px); padding: 40px 16px; color: var(--text-2); }
.placeholder svg.art { margin-bottom: 14px; }
.placeholder h2 { margin-bottom: 6px; }
.placeholder .keys { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 18px; color: var(--text-3); font-size: 12.5px; }
.placeholder .keys span { display: inline-flex; align-items: center; gap: 6px; }
.stage.open .placeholder { display: none; }

/* ---------- checklist detail ---------- */
.detailgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.detailgrid .card { margin-bottom: 0; }
.dhead { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; }
.dtitle { min-width: 0; }
.issue { color: var(--text-2); font-size: 13.5px; font-style: italic; margin: 4px 0 8px; overflow-wrap: anywhere; }
.ring { position: relative; flex: none; display: grid; place-items: center; }
.ring svg { transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-3); }
.ring .meter { transition: stroke-dashoffset .5s var(--ease); }
.ring .rlabel { position: absolute; text-align: center; font: 700 13px/1.1 var(--font); }
.ring .rlabel small { display: block; font: 600 10px var(--font); color: var(--text-3); margin-top: 1px; }
.backbtn { display: none; margin-bottom: 12px; }
.morebar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 12px 0 0; }
.btnchip { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--accent); background: transparent; border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 999px; padding: 4px 11px; font: 600 12px var(--font); transition: background .15s; }
.btnchip:hover { background: var(--accent-soft); }
.srchead { margin: 0; padding: 9px 14px 7px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); background: var(--surface-3); border-bottom: 1px solid var(--border); }

.steps { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); overflow: hidden; }
.step { border-bottom: 1px solid var(--border); transition: background .15s; }
.step:last-child { border-bottom: 0; }
.step .row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 12px 12px 14px; }
.check { flex: none; display: grid; place-items: center; width: 24px; height: 24px; margin-top: 1px; padding: 0; border-radius: 999px; border: 2px solid var(--border-strong); background: transparent; color: transparent; cursor: pointer; transition: all .18s var(--ease); }
.check:hover { border-color: var(--accent); }
.step.done .check { background: var(--good); border-color: var(--good); color: #052e22; animation: pop2 .28s var(--ease); }
.step.fail .check { background: var(--bad); border-color: var(--bad); color: #3a0b11; animation: pop2 .28s var(--ease); }
.step.na .check { background: var(--surface-3); border-color: var(--border-strong); color: var(--text-3); }
@keyframes pop2 { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: none; } }
.stepbody { flex: 1; min-width: 0; cursor: pointer; padding-top: 1px; }
.steptext { overflow-wrap: anywhere; }
.stepnum { color: var(--text-3); font-weight: 600; margin-right: 6px; }
.step.done .steptext { color: var(--text-2); }
.step.done .stepnum { color: var(--good); }
.step.fail { background: var(--bad-soft); }
.step.na .steptext { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--border-strong); }
.stepacts { display: flex; gap: 2px; flex: none; align-items: center; justify-content: flex-end; }
.act { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 7px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--text-3); cursor: pointer; font: 600 12px var(--font); transition: all .15s; }
.act:hover { background: var(--surface-3); color: var(--text); }
.act[aria-pressed="true"].f { color: var(--bad); background: var(--bad-soft); }
.act[aria-pressed="true"].n { color: var(--text); background: var(--surface-3); }
.act.tips[aria-pressed="true"] { color: var(--warn); background: var(--warn-soft); }
.act.tips svg { transition: transform .2s var(--ease); }
.act.tips[aria-pressed="true"] svg { transform: rotate(180deg); }
.trouble { margin: 0 12px 12px 50px; padding: 4px 12px; border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 var(--r-sm) var(--r-sm) 0; animation: rise .2s var(--ease); }
.trouble .t { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; font-size: 13.5px; }
.trouble .t + .t { border-top: 1px dashed color-mix(in srgb, var(--warn) 30%, transparent); }
.trouble .t b { color: var(--text); }
.vcheck { display: flex; gap: 10px; align-items: flex-start; padding: 6px 2px; cursor: pointer; }
.aibar { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px dashed var(--border-strong); border-radius: var(--r-md); padding: 14px 16px; background: linear-gradient(135deg, var(--accent-soft), transparent 60%); }
.aibar.hot { border-color: var(--bad); border-style: solid; background: linear-gradient(135deg, var(--bad-soft), transparent 60%); }

/* ---- density ---- */
:root[data-density="compact"] body { font-size: 13.5px; }

:root[data-density="compact"] .step .row { padding: 7px 10px 7px 12px; gap: 10px; }

:root[data-density="compact"] .panel { padding: 10px 12px; margin-top: 10px; }

.steps.focus .step { transition: opacity .25s var(--ease), background .15s; }
.steps.focus .step:not(.current) { opacity: .42; }
.steps.focus .step:not(.current):hover, .steps.focus .step:not(.current):focus-within { opacity: .9; }
.steps.focus .skipnote { opacity: .5; }
.togglebtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.kbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 10px 2px 0; font-size: 12.5px; color: var(--text-3); }
.kbar span { display: inline-flex; align-items: center; gap: 5px; }
.kbd { display: inline-block; min-width: 20px; padding: 1px 6px; text-align: center; font: 600 11.5px/1.5 var(--mono); color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 6px; }

.step.just .check svg path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: drawck .24s var(--ease) .04s forwards; }

.ring.pulse { animation: ringpulse .6s var(--ease); }

.tour p { margin: 0 0 12px; color: var(--text-2); font-size: 13.5px; }

.tip { margin-top: 14px; max-width: 460px; color: var(--text-3); font-size: 13px; }
.saved { margin-top: 12px; color: var(--text-2); font-size: 13.5px; }

.emptyhelp { text-align: center; padding: 28px 10px; }

/* ---- settings swatches ---- */
.swatches { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 4px; }
.swatch { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }

.swatch[data-a="emerald"] i { background: linear-gradient(135deg, #34d399, #2dd4d0); }
.swatch[data-a="amber"] i { background: linear-gradient(135deg, #fbbf24, #fb923c); }

/* ---- a touch more spring on panels ---- */
@media (max-width: 820px) {
  .pane.detail { transition: transform .3s cubic-bezier(.2, .9, .25, 1.04); }
}
@media (prefers-reduced-motion: reduce) {
  .celebrate, .ring.pulse, .notes .line.fresh, .step.just .check svg path, .skel, .palette, .tour { animation: none !important; }
  .step.just .check svg path { stroke-dashoffset: 0 !important; }
}

.resultwrap .result { padding-right: 38px; }
:root[data-density="compact"] .resultwrap .result { padding: 9px 38px 9px 12px; }
/* while the tour card is up it carries the tips, so the empty screen keeps clear of it */
body.tour-on .placeholder .tip, body.tour-on .placeholder .saved { display: none; }

      mostEscalated: procs.filter(function (x) { return x.runs >= 3 && x.escalated; }).sort(function (a, b) { return b.escalated / b.runs - a.escalated / a.runs; }).slice(0, 8),
      longest: procs.filter(function (x) { return x.runs >= 3; }).sort(function (a, b) { return b.avgSecs - a.avgSecs; }).slice(0, 8),
      gaps: Object.keys(gaps).map(function (k) { return { category: k, count: gaps[k] }; }).sort(function (a, b) { return b.count - a.count; }),
      mostFailed: list.filter(function (x) { return x.failed; }).sort(function (a, b) { return b.failRate - a.failRate || b.total - a.total; }).slice(0, 10),
      slowest: list.filter(function (x) { return x.avgGap != null && x.avgGap > 0; }).sort(function (a, b) { return b.avgGap - a.avgGap; }).slice(0, 8),
      mostSkipped: list.filter(function (x) { return x.na + x.untouched; }).sort(function (a, b) { return b.skipRate - a.skipRate || b.total - a.total; }).slice(0, 10)
    };
  }

  // ---- exports that can be combined without a server
  function newId(n) { var c = 'abcdefghjkmnpqrstuvwxyz23456789', o = ''; for (var i = 0; i < (n || 12); i++) o += c.charAt(Math.floor(Math.random() * c.length)); return o; }
  function buildStatsExport(tech, history, steps, nowIso) {
    return { app: 'service-desk-workbench', kind: 'stats', version: 1, techId: String(tech.id || ''), label: String(tech.label || '').slice(0, 40), exportedAt: nowIso || new Date().toISOString(),
      history: history.map(function (e) { return { eid: e.eid, t: e.t, title: e.title, category: e.category, validation: e.validation, outcome: e.outcome, done: e.done, total: e.total, secs: e.secs, gap: !!e.gap }; }), steps: steps || {} };
  }
  // Newest export per technician wins (each one is cumulative), so importing the same file twice, or an old and a new
  // file from one person, never inflates the numbers.
  function combineStats(files) {
    var latest = {}, included = [], ignored = [];
    files.forEach(function (f) {
      var name = f.name || 'file';
      var d = f.data;
      if (!d || d.app !== 'service-desk-workbench' || d.kind !== 'stats' || !Array.isArray(d.history) || !d.techId) { ignored.push({ name: name, reason: 'Not a Workbench stats export' }); return; }
      var cur = latest[d.techId];
      if (cur && cur.data.exportedAt === d.exportedAt) { ignored.push({ name: name, reason: 'Same export already included' }); return; }
      if (cur && cur.data.exportedAt > d.exportedAt) { ignored.push({ name: name, reason: 'An older export from the same person' }); return; }
      if (cur) ignored.push({ name: cur.name, reason: 'Replaced by a newer export from the same person' });

    });
    var seen = {}, history = [], stores = [];
    Object.keys(latest).forEach(function (id) {
      var d = latest[id].data;
      included.push({ name: latest[id].name, label: d.label || 'Tech ' + id.slice(0, 4), exportedAt: d.exportedAt, runs: d.history.length });
      d.history.forEach(function (e) { if (e && e.eid && !seen[e.eid]) { seen[e.eid] = 1; history.push(e); } });

  }

  function buildBackup(lib, settings, history, steps, tech, nowIso) {
    return { app: 'service-desk-workbench', kind: 'backup', version: 1, exportedAt: nowIso || new Date().toISOString(),
      note: 'Procedures, settings and counts only. No ticket text is ever stored in or exported from the Workbench.',
      settings: { theme: settings.theme, aiUrl: settings.aiUrl, scrubPrefixes: settings.scrubPrefixes || '' }, tech: tech || {},
      procedures: lib, history: history, steps: steps || {} };
  }

  return { subtractStepStats: subtractStepStats, resolvedToday: resolvedToday, weekSummary: weekSummary, MIN_PER_TICKET: MIN_PER_TICKET, stepKey: stepKey, stepResults: stepResults, addStepStats: addStepStats, mergeStepStores: mergeStepStores, report: report, buildStatsExport: buildStatsExport, combineStats: combineStats, buildBackup: buildBackup, newId: newId,
    pathInfo: pathInfo, setScrubPrefixes: setScrubPrefixes, editDist: editDist, pastTense: pastTense, buildNotes: buildNotes, search: search, rank: rank, pickDefault: pickDefault, buildComposite: buildComposite, appendToComposite: appendToComposite, scrub: scrub, buildAIPrompt: buildAIPrompt, emptyState: emptyState, stepKind: stepKind, progress: progress,
    activeSteps: activeSteps, pendingBranches: pendingBranches, branchChoice: branchChoice, deviceLine: deviceLine, deviceRelevant: deviceRelevant,
    DEVICE_MAKES: DEVICE_MAKES, DEVICE_MODELS: DEVICE_MODELS,
    formatDuration: formatDuration, toCSV: toCSV, stats: stats, OUTCOMES: OUTCOMES };
});

/*
 * File importers: .docx (Word) and .html -> plain text that parser.js understands.
 * Offline, dependency-free. A .docx is a zip; we read the zip ourselves and inflate with the
 * browser's built-in DecompressionStream. No XML/HTML parser is used, so nothing in an imported
 * file is ever executed, fetched, or expanded.
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) { module.exports = api; }
  else { root.WBImporters = api; }

  'use strict';

  var MAX_XML = 8 * 1024 * 1024; // cap on decompressed document.xml (zip-bomb guard)

  function utf8(u8) { return new TextDecoder('utf-8').decode(u8); }

  function decodeEntities(s) {
    return String(s).replace(/&(#x[0-9a-fA-F]+|#\d+|amp|lt|gt|quot|apos|nbsp|ndash|mdash|rsquo|lsquo|rdquo|ldquo|hellip|bull);/g, function (m, e) {
      switch (e) {
        case 'amp': return '&'; case 'lt': return '<'; case 'gt': return '>'; case 'quot': return '"'; case 'apos': return "'";
        case 'nbsp': return ' '; case 'ndash': return '–'; case 'mdash': return '—'; case 'rsquo': return '’';
        case 'lsquo': return '‘'; case 'rdquo': return '”'; case 'ldquo': return '“'; case 'hellip': return '…'; case 'bull': return '•';
      }
      var n = e.charAt(1) === 'x' || e.charAt(1) === 'X' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
      if (!isFinite(n) || n < 1 || n > 0x10FFFF || (n >= 0xD800 && n <= 0xDFFF)) return '';
      try { return String.fromCodePoint(n); } catch (err) { return ''; }
    });
  }

  // ---------- zip reading ----------
  async function inflateRaw(data, max) {
    var ds = null;
    try { ds = new DecompressionStream('deflate-raw'); } catch (e) { ds = null; }
    if (!ds) {
      throw new Error('This browser is too old to open .docx files (needs Chrome 103 or newer). Update Chrome, or paste the text instead.');
    }
    var stream = new Blob([data]).stream().pipeThrough(ds);
    var reader = stream.getReader(), chunks = [], total = 0;
    for (;;) {
      var r = await reader.read();
      if (r.done) break;
      total += r.value.length;
      if (total > max) { try { await reader.cancel(); } catch (e) { /* ignore */ } throw new Error('Document is too large to import.'); }
      chunks.push(r.value);

    chunks.forEach(function (c) { out.set(c, off); off += c.length; });

  }

    for (var i = u8.length - 22; i >= lo; i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }

      if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
      var flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true);

      if (idx === 0 && (/<w:tblHeader\b/.test(row) || cells.every(function (c) { return HEADER_CELL.test(c); }))) return;

  function xmlToText(xml) {

    var re = /<w:tbl\b[\s\S]*?<\/w:tbl>|<w:p\b[\s\S]*?<\/w:p>/g, m, lines = [];

      else if (/^Heading\s*\d/i.test(s)) lines.push('## ' + text);
      else if (/<w:numPr\b/.test(chunk)) lines.push('- ' + text);
      else lines.push(text);

    return lines.join('\n');
  }

  async function docxToText(buf, opts) {
    var max = (opts && opts.maxBytes) || MAX_XML;
    var xml = await readZipEntry(buf, 'word/document.xml', max);
    if (!xml) throw new Error('No document body found. Is this a Word (.docx) file?');
    var text = xmlToText(utf8(xml));
    if (!text.trim()) throw new Error('The document has no readable text.');
    return text;
  }

  // ---------- html -> text ----------
  function htmlToText(html) {
    var s = String(html)
      .replace(/<!--[\s\S]*?-->/g, '')
      .replace(/<(script|style|head|noscript|svg)\b[\s\S]*?<\/\1\s*>/gi, '')
      .replace(/<h([1-6])\b[^>]*>/gi, '\n## ')
      .replace(/<\/h[1-6]\s*>/gi, '\n')
      .replace(/<li\b[^>]*>/gi, '\n- ')
      .replace(/<tr\b[^>]*>/gi, '\n- ')
      .replace(/<\/t[dh]\s*>\s*(?=<t[dh]\b)/gi, ': ')
      .replace(/<(br|hr)\b[^>]*>/gi, '\n')
      .replace(/<\/(p|div|ul|ol|table|tr|section|article|li|blockquote|pre)\s*>/gi, '\n')
      .replace(/<(p|div|ul|ol|table|section|article|blockquote|pre)\b[^>]*>/gi, '\n')
      .replace(/<[^>]*>/g, '');

    var lines = s.split('\n').map(function (l) { return l.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
    // a lone first "## Title" heading is the title
    if (lines.length && /^## /.test(lines[0])) lines[0] = lines[0].slice(3);
    return lines.join('\n');
  }

  return { docxToText: docxToText, htmlToText: htmlToText, xmlToText: xmlToText, decodeEntities: decodeEntities, readZipEntry: readZipEntry };
});

<script>
window.WB_SAMPLES = ["Headset, Microphone, or Speakers Not Working\nCategory: Windows\nSystems: Windows, Teams\nOwner: Help Desk\nVersion: 1.0\n\nSteps:\n1. Check the device is plugged in or paired, switched on, and not muted by its own button\n2. Check volume and mute using the speaker icon on the Windows taskbar\n3. Choose the right output and input device in Settings > System > Sound\n4. Check the microphone is allowed in Settings > Privacy & security > Microphone\n5. Check the device selected inside the app, such as Teams, Zoom, or the browser\n6. Unplug and replug the device, or remove and pair it again if it is Bluetooth\n7. Restart the computer\n\nValidation:\n- The user can hear the test sound and the other side can hear them\n\nTroubleshooting:\n- If it works on another computer, the problem is the Windows driver or settings on this one\n- If the microphone is blocked only in Chrome, check the site's microphone permission in Chrome settings\n- If the device does not appear at all, check Device Manager for a warning icon\n\nEscalation:\n- Escalate to Desktop Support if the device is not detected in Device Manager or needs a driver the user cannot install\n","Chrome Google Account and Sync Problems\nCategory: Browser\nSystems: Chrome, Windows\nOwner: Help Desk\nVersion: 1.0\n\nSteps:\n1. Confirm which account the user expects to be using in Chrome\n2. Click the profile icon in Chrome to see which account is active and whether sync is on or paused\n3. Check the computer's date, time, and time zone are correct\n4. Sign out of Chrome from the profile menu, then sign back in\n5. Turn sync off and on again at chrome://settings/syncSetup\n6. Test with a new Chrome profile to see if the old profile is damaged\n\nValidation:\n- The correct account shows in the profile icon and sync is on\n- Bookmarks and saved passwords appear within a few minutes\n\nTroubleshooting:\n- If a company policy blocks sync, check that the account is allowed and the device is managed correctly\n- If the user is asked for the password again and again, check the account for a lockout or a recent password change\n- If sync stays stuck, sign out, clear the profile's browsing data, and sign back in\n\nEscalation:\n- Escalate to the Identity team if the account is correct but access is blocked by policy\n","Chrome Is Slow, Freezing, or Crashing\nCategory: Browser\nSystems: Chrome, Windows\nOwner: Help Desk\nVersion: 1.0\n\nSteps:\n1. Confirm it is only Chrome by trying the same site in another browser\n2. Check Chrome is up to date at chrome://settings/help and relaunch if prompted\n3. Close all Chrome windows, then reopen Chrome\n4. Open an Incognito window (Ctrl+Shift+N) and test the same site\n5. Open Chrome Task Manager (Shift+Esc) and end any tab or extension using a lot of memory\n6. Turn off extensions one at a time at chrome://extensions\n7. Clear cached images and files (Ctrl+Shift+Delete) for All time\n\nValidation:\n- The page loads normally in a regular (not Incognito) window\n- Chrome stays responsive with the user's usual tabs open\n\nTroubleshooting:\n- If the site works in Incognito but not normally, an extension or cached data is the cause, so work through the extensions\n- If Chrome crashes right after opening, check for pending Windows updates and restart the computer\n- If only one site is slow in every browser, the problem is the site or the network, not Chrome\n- If Chrome still misbehaves after the steps above, create a new Chrome profile and test there\n\nEscalation:\n- Escalate to Desktop Support if Chrome crashes on a clean profile or the computer is also slow outside Chrome\n","Laptop Will Not Power On (Sample)\nCategory: Hardware\nSystems: Windows\n\nPurpose\nTo get a laptop that will not turn on, or will not boot, working again. Most of our laptops are HP or Lenovo, and the quick checks differ slightly.\n\nSteps:\n1. Confirm the laptop is plugged into a working outlet and the charger light is on\n2. Hold the power button for 15 seconds, then try to turn it on again\n3. Unplug everything (dock, USB devices, external monitor) and try again\n\nHP\n1. Hold the power button for 30 seconds with the charger unplugged, then plug in and press power\n2. Check whether the keyboard lights flash, then count the blinks and note the pattern for the ticket\n3. Press Esc at power on and open the HP startup menu to run the hardware diagnostics\n\nLenovo\n1. Look for the small pinhole reset button on the bottom, press it with a paperclip, then power on\n2. Hold the Novo button if there is one, or press F12 at power on, and open the boot menu\n3. Note any beep or flash pattern for the ticket\n\nValidation:\n- The laptop boots to the sign-in screen\n\nTroubleshooting:\n- If the charger light is off, try a different charger before anything else\n\nEscalation:\n- Escalate to Tier 2 or desktop support if the laptop still will not power on after the checks above\n","Leave of Absence (Sample)\nCategory: HR Requests\nSystems: AD, Jira\nOwner: Help Desk\nVersion: 1.0\n\nSteps:\n1. Verify the LOA request ticket is approved by HR\n2. Disable remote access for the employee in AD\n3. Add an LOA note to the employee's AD account description\n4. Create a Jira comment documenting the changes\n\nValidation:\n- Employee account shows the LOA note in AD\n- Jira ticket contains the documentation comment\n\nTroubleshooting:\n- If the ticket is not approved, set it to Waiting on User and ask HR to approve it\n- If the AD account cannot be found, check for a recent name change or a duplicate account\n- If the AD description field will not save, confirm you have rights to the employee's OU\n\nEscalation:\n- Escalate to Tier 2 / Identity team if AD changes are rejected after one retry\n","Mapped Network Drive Missing (Sample)\nCategory: Files\nSystems: Windows\n\nPurpose\nGets a missing shared drive (for example the S: drive) back on a user's laptop.\n\nSteps:\n1. Confirm the user can open other internal sites, so the problem is not the whole network\n2. Is the laptop connected to the company network or VPN? Yes: step 4. No: step 3.\n3. Connect the laptop to the company network or VPN, then check the drive again\n4. Have the user open File Explorer and look for the drive under This PC\n5. Run (CMD): net use\nExpected result: The list shows the drive letter with a status of OK, or Disconnected.\nWhat it does: Lists the network drives this computer currently has mapped.\n6. Is the drive listed as Disconnected? Yes: step 7. No: step 8.\n7. Run (CMD): net use S: /delete\nWARNING: Only run this for the drive that is broken. It removes the mapping and the user will need it added again.\n8. Add the drive again from the drive mapping steps in the team knowledge base\n9. Have the user open a file on the drive to confirm it works\n\nValidation:\n- The user can open and save a file on the drive\n\nTroubleshooting:\n- If the drive reappears and then disappears again after a restart, the user may be signing in with the wrong account\n\nEscalation:\n- Escalate to the file server team if other users also lose the drive\n","Legal Name Change (Sample)\nCategory: HR Requests\nSystems: AD, Outlook, Jira\n\nSteps:\n1. Confirm the name change request is approved in the ticket\n2. Update the display name and last name in AD\n3. Update the email address and add the old address as an alias\n4. Have the user restart Outlook and confirm the new name shows\n5. Add a note to the ticket listing the old and new names\n\nValidation:\n- New display name shows in the address book\n- Mail sent to the old address still arrives\n\nTroubleshooting:\n- If the old name still shows in Outlook, have the user rebuild the Outlook profile\n- If mail to the old address bounces, confirm the alias was added to the mailbox\n\nEscalation:\n- Escalate to the Messaging team if the mailbox will not accept the new address\n","New Hire Setup (Sample)\nCategory: Onboarding\nSystems: AD, Okta, Jira\n\nSteps:\n1. Confirm the new hire ticket has a start date, manager, and department\n2. Create the AD account using the naming standard\n3. Add the user to the department groups\n4. Enable MFA enrollment in Okta\n5. Assign a laptop and record the asset tag in the ticket\n6. Create a Jira comment with the account details\n\nValidation:\n- The user can sign in and completes MFA enrollment\n- Asset tag is recorded in the ticket\n\nTroubleshooting:\n- If the username is already taken, follow the naming standard's tiebreaker rule\n- If the user does not receive the MFA prompt, re-send enrollment and verify the registered email\n\nEscalation:\n- Escalate to Tier 2 if the account cannot be created or group membership will not apply\n","Outlook Not Syncing or Not Receiving Email (Sample)\nCategory: Email\nSystems: Outlook, Exchange\n\nSteps:\n1. Confirm the user can sign in to webmail\n2. Check that Outlook is not in Offline mode and the network is connected\n3. Have the user close and reopen Outlook\n4. Restart the computer if Outlook still shows Disconnected\n5. Create a new Outlook profile and re-add the mailbox\n6. Verify new mail arrives in the desktop client\n\nValidation:\n- New mail appears in Outlook within 5 minutes\n\nTroubleshooting:\n- If webmail also fails, check whether the account is locked or the password expired\n- If the mailbox is full, have the user archive or delete items, then retry\n- If the new profile will not connect, confirm the mailbox exists in Exchange\n\nEscalation:\n- Escalate to the Messaging team if webmail works but Outlook never syncs after a new profile\n","Password Reset and Account Unlock (Sample)\nCategory: Account Access\nSystems: AD, Okta\n\nSteps:\n1. Verify the caller's identity using two identifiers from the approved list\n2. Check whether the AD account is locked, disabled, or expired\n3. Unlock the account in AD if it is locked\n4. Reset the password in AD and require a change at next sign-in\n5. Have the user sign in with the temporary password and set a new one\n6. Add a note to the ticket listing what was done\n\nValidation:\n- The user signs in successfully with the new password\n- The account no longer shows as locked in AD\n\nTroubleshooting:\n- If the account locks again right away, look for a phone, mapped drive, or saved session still using the old password\n- If the new password is rejected, check the password policy for length, complexity, and history\n- If the user cannot get the MFA prompt, re-send the Okta enrollment link\n\nEscalation:\n- Escalate to Tier 2 / Identity team if the account cannot be unlocked or the reset fails after one retry\n","Printer Not Printing (Sample)\nCategory: Hardware\nSystems: Print Server\n\nSteps:\n1. Confirm the printer is powered on and shows no error on its display\n2. Check that the user selected the correct printer\n3. Clear the print queue on the user's computer\n4. Restart the print spooler service\n5. Remove and re-add the printer on the user's computer\n6. Print a test page\n\nValidation:\n- The test page prints\n\nTroubleshooting:\n- If the queue will not clear, restart the print spooler and delete the stuck job\n- If the printer is offline, check its network cable or Wi-Fi connection\n- If only one user is affected, check that user's printer permissions\n\nEscalation:\n- Escalate to Desktop Support if the printer shows a hardware error or is down for everyone\n","VPN Will Not Connect (Sample)\nCategory: Remote Access\nSystems: VPN, Okta\n\nSteps:\n1. Confirm the user has a working internet connection\n2. Verify the user is entering the correct VPN address and username\n3. Check that the user's account is not locked and the password has not expired\n4. Have the user restart the VPN client\n5. Verify the user completes the MFA prompt\n6. Reinstall the VPN client if the error continues\n\nValidation:\n- The VPN shows Connected and the user can reach an internal site\n\nTroubleshooting:\n- If the VPN connects but internal sites do not load, check DNS by having the user disconnect and reconnect\n- If the MFA prompt never arrives, re-send the Okta enrollment link\n- If the user is on hotel or public Wi-Fi, have them switch to a phone hotspot\n\nEscalation:\n- Escalate to Network Support if several users cannot connect at the same time\n","Website Will Not Load or Shows a Certificate Error\nCategory: Browser\nSystems: Chrome, Windows\nOwner: Help Desk\nVersion: 1.0\n\nSteps:\n1. Get the exact error message or error code shown on the page\n2. Check whether other websites load, and whether the site loads on another device or network\n3. Confirm the computer's date, time, and time zone are correct\n4. Try the site in an Incognito window\n5. Flush the DNS cache by running ipconfig /flushdns in Command Prompt\n6. Check the proxy setting under Windows Settings > Network & internet > Proxy matches the company standard\n7. Clear cached images and files for the site\n\nValidation:\n- The site loads without any warning\n\nTroubleshooting:\n- If every site fails, treat it as a network problem and check Wi-Fi, cable, and VPN first\n- If only one site fails for everyone, report the outage to the site owner or vendor\n- If the error mentions a certificate or a private connection, check the clock first and never tell the user to bypass the warning\n- If the error is ERR_NAME_NOT_RESOLVED, check the VPN connection and DNS settings\n\nEscalation:\n- Escalate to Network Support if several users cannot reach the same internal site\n","Windows Computer Is Slow or Freezing\nCategory: Windows\nSystems: Windows\nOwner: Help Desk\nVersion: 1.0\n\nSteps:\n1. Ask when it started and whether it is slow all the time or only with one app\n2. Open Task Manager (Ctrl+Shift+Esc) and check CPU, memory, and disk usage\n3. Save the user's work, then close the app using the most resources if it is not needed\n4. Check free disk space and clear temporary files in Settings > System > Storage\n5. Review startup apps in Task Manager and disable ones the user does not need\n6. Check for pending Windows updates and restart the computer\n7. Run the company-approved security scan\n\nValidation:\n- Task Manager shows normal usage and the user confirms the computer feels responsive\n\nTroubleshooting:\n- If disk usage sits at 100 percent, check whether Windows Update or a security scan is running and let it finish\n- If memory is high after many days without a restart, restart the computer\n- If it is only slow in Chrome, use the Chrome slow or crashing procedure\n- If the computer has very little memory for its workload, ask Desktop Support about a hardware refresh\n\nEscalation:\n- Escalate to Desktop Support if usage stays high with nothing running or the disk shows errors\n","Windows No Internet or Wi-Fi Will Not Connect\nCategory: Windows\nSystems: Windows, VPN\nOwner: Help Desk\nVersion: 1.0\n\nSteps:\n1. Check Airplane mode is off and Wi-Fi is switched on, or that the network cable is plugged in\n2. Check whether other devices on the same network have internet\n3. Disconnect and reconnect to the network\n4. Restart the computer\n5. Run the Windows network troubleshooter from Settings > Network & internet > Status\n6. Release and renew the IP address by running ipconfig /release and then ipconfig /renew in Command Prompt\n7. Flush the DNS cache by running ipconfig /flushdns\n\nValidation:\n- The computer is connected and websites and internal tools load\n\nTroubleshooting:\n- If it says connected but nothing loads, disconnect the VPN and test again\n- If only this computer is affected, update or reinstall the network adapter driver\n- If other devices also have no internet, treat it as a network outage and report it\n- If the steps above fail, reset the network stack with netsh winsock reset as administrator and restart\n\nEscalation:\n- Escalate to Network Support if several users on the same network have no connection\n","Set Up Work Email on a Phone (Sample)\nCategory: Mobile\nSystems: MFA\n\nPurpose\nTo get company email working on a user's phone. The steps differ for iPhone and Android.\n\nSteps:\nBefore you begin:\n1. Confirm the user already has a working mailbox on a computer\n2. Confirm the phone's operating system is up to date\n\nProcess for iPhone\n1. Open Settings, then Mail, then Accounts, then Add Account\n2. Choose Exchange and enter the work email address\n3. Approve the MFA prompt when it appears\n4. Accept the security policy prompt\n\nProcess for Android:\n1. Install the Microsoft mail app from the Play Store\n2. Open the app and tap Add account\n3. Approve the MFA prompt when it appears\n4. Accept the device policy prompt\n\nAll devices\n1. Send a test email to and from the phone\n2. Confirm the calendar syncs\n\nValidation:\n- Mail and calendar appear on the phone\n\nTroubleshooting:\n- If the policy prompt never appears, have the user restart the phone and try again\n\nEscalation:\n- Escalate to Tier 2 if the account still will not add after the MFA prompt is approved\n"];

  // ---------- team stats (combine everyone's exports, no server) ----------
  function myStats() { return C.buildStatsExport({ id: settings.techId, label: settings.techLabel }, history, stepStats); }

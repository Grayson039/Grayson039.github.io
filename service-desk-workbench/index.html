<style>
/* ==========================================================================
   Service Desk Workbench: design system
   Tokens > base > layout > components > views. Dark is the default; light follows
   the OS in "auto" or when chosen. No external fonts or assets (offline, CSP-safe).
   ========================================================================== */
:root {
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "SF Mono", ui-monospace, Consolas, Menlo, monospace;

  --bg: #0a0e17;
  --bg-glow: rgba(91, 140, 255, .14);
  --surface: #111827;
  --surface-2: #161f31;
  --surface-3: #1c2740;
  --border: #223049;
  --border-strong: #30415f;
  --text: #e9eefa;
  --text-2: #a4b1c9;
  --text-3: #6f7f9b;
  --accent: #6b95ff;
  --accent-2: #8b7bff;
  --accent-soft: rgba(107, 149, 255, .14);
  --on-accent: #0a1020;
  --good: #3fd6a0;
  --good-soft: rgba(63, 214, 160, .14);
  --warn: #f6b94e;
  --warn-soft: rgba(246, 185, 78, .13);
  --bad: #ff7a85;
  --bad-soft: rgba(255, 122, 133, .13);
  --code: #0b111d;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
  --shadow-md: 0 8px 28px rgba(0, 0, 0, .38);
  --ring: 0 0 0 3px rgba(107, 149, 255, .38);
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}

/* light palette: explicit light, and "auto" on a light OS */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f6fc; --bg-glow: rgba(70, 110, 240, .10);
  --surface: #ffffff; --surface-2: #f6f8fd; --surface-3: #ecf0f9;
  --border: #e2e8f4; --border-strong: #cdd7ea;
  --text: #0f172a; --text-2: #475775; --text-3: #7384a3;
  --accent: #3a63f0; --accent-2: #6a4df0; --accent-soft: rgba(58, 99, 240, .10); --on-accent: #ffffff;
  --good: #0c9b6c; --good-soft: rgba(12, 155, 108, .11);
  --warn: #b7791f; --warn-soft: rgba(183, 121, 31, .12);
  --bad: #d23f4d; --bad-soft: rgba(210, 63, 77, .10);
  --code: #f4f7fd;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06); --shadow-md: 0 10px 30px rgba(15, 23, 42, .12);
  --ring: 0 0 0 3px rgba(58, 99, 240, .28);
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    color-scheme: light;
    --bg: #f3f6fc; --bg-glow: rgba(70, 110, 240, .10);
    --surface: #ffffff; --surface-2: #f6f8fd; --surface-3: #ecf0f9;
    --border: #e2e8f4; --border-strong: #cdd7ea;
    --text: #0f172a; --text-2: #475775; --text-3: #7384a3;
    --accent: #3a63f0; --accent-2: #6a4df0; --accent-soft: rgba(58, 99, 240, .10); --on-accent: #ffffff;
    --good: #0c9b6c; --good-soft: rgba(12, 155, 108, .11);
    --warn: #b7791f; --warn-soft: rgba(183, 121, 31, .12);
    --bad: #d23f4d; --bad-soft: rgba(210, 63, 77, .10);
    --code: #f4f7fd;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06); --shadow-md: 0 10px 30px rgba(15, 23, 42, .12);
    --ring: 0 0 0 3px rgba(58, 99, 240, .28);
  }
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14.5px/1.5 var(--font); color: var(--text); letter-spacing: -.003em;
  background: radial-gradient(900px 420px at 72% -8%, var(--bg-glow), transparent 62%), var(--bg);
  display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; letter-spacing: -.015em; }
h2 { font-size: 20px; line-height: 1.25; font-weight: 700; }
h3 { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin: 22px 0 10px; }
p { margin: 0 0 10px; }
.muted { color: var(--text-2); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.hidden { display: none !important; }
.sr { position: absolute; left: -9999px; }
.bad { color: var(--bad); }
a { color: var(--accent); }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--ring); }
::selection { background: var(--accent-soft); }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
kbd, .kbd { font: 600 11px/1 var(--mono); color: var(--text-3); background: var(--surface-2); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; padding: 3px 6px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 7px 14px;
  font: 600 13.5px/1 var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-md); cursor: pointer; transition: background .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease), box-shadow .15s var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px); }
.btn.primary { color: var(--on-accent); border-color: transparent; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 14px rgba(107, 149, 255, .28); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ok { color: var(--good); border-color: var(--good); background: var(--good-soft); }
.btn.sm { min-height: 30px; padding: 5px 10px; font-size: 12.5px; border-radius: var(--r-sm); }
.btn.link { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.link:hover { color: var(--text); background: var(--surface-2); }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.btn[disabled] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn.block { width: 100%; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.iconbtn { flex: none; display: inline-grid; place-items: center; width: 38px; height: 38px; color: var(--text-2); background: transparent; border: 1px solid transparent; border-radius: 10px; cursor: pointer; transition: background .15s, color .15s; }
.iconbtn:hover { background: var(--surface-2); color: var(--text); }

/* segmented controls (validation / outcome) */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; }
.seg .btn { min-height: 32px; border-color: transparent; background: transparent; border-radius: 9px; color: var(--text-2); }
.seg .btn:hover { background: var(--surface-3); color: var(--text); }
.seg .btn[aria-pressed="true"] { background: var(--surface); color: var(--text); border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.seg .btn.good[aria-pressed="true"] { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.seg .btn.bad[aria-pressed="true"] { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.seg .btn.on[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ---------- inputs ---------- */
input[type=text], input[type=search], textarea {
  width: 100%; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; font: inherit;
  transition: border-color .15s, box-shadow .15s;
}
input[type=text]:focus, textarea:focus { border-color: var(--accent); box-shadow: var(--ring); }
textarea { resize: vertical; min-height: 84px; }
textarea.mono { font: 12.5px/1.55 var(--mono); min-height: 200px; }
::placeholder { color: var(--text-3); }
input[type=checkbox] { accent-color: var(--accent); width: 17px; height: 17px; margin: 0; flex: none; }

/* ---------- cards & surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
.card > h2:first-child { margin-bottom: 4px; }
.infobox { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px; margin: 10px 0; font-size: 13.5px; }
.infobox ul { margin: 6px 0 0 18px; padding: 0; }
.warnbox { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn); border-radius: var(--r-md); padding: 9px 12px; margin: 0 0 10px; font-size: 13px; }
.panel { border: 1px solid var(--border); background: var(--surface-2); border-radius: var(--r-md); padding: 14px 16px; margin-top: 16px; }
.panel h3 { margin-top: 0; }
.panel.ai { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); background: linear-gradient(180deg, var(--accent-soft), transparent 60%), var(--surface-2); }
.pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); margin-left: 6px; vertical-align: middle; }
.pill.auto { background: var(--warn-soft); color: var(--warn); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); margin: 0 6px 6px 0; }
.chip.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: var(--good-soft); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); }
.chips { display: flex; flex-wrap: wrap; }
.bar { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius: 999px; transition: width .35s var(--ease); }
.bar.sm { height: 5px; }

/* ---------- top bar ---------- */
#top { flex: none; position: relative; z-index: 20; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 14px; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: -.02em; font-size: 15.5px; white-space: nowrap; }
.brand svg { flex: none; filter: drop-shadow(0 3px 8px rgba(107, 149, 255, .35)); }
.searchbox { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; max-width: 760px; margin: 0 auto; }
.searchbox > svg { position: absolute; left: 14px; color: var(--text-3); pointer-events: none; }
.searchbox input { padding: 11px 44px 11px 42px; font-size: 15px; border-radius: 999px; background: var(--surface-2); }
.searchbox .kbd { position: absolute; right: 14px; pointer-events: none; }
.clearbtn { position: absolute; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; color: var(--text-3); background: var(--surface-3); border: 0; border-radius: 999px; cursor: pointer; }
.clearbtn:hover { color: var(--text); }
.menu { position: absolute; right: 12px; top: calc(100% + 6px); min-width: 230px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; padding: 6px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; animation: pop .14s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
.menuitem { display: flex; align-items: center; gap: 10px; text-align: left; color: var(--text); background: transparent; border: 0; padding: 10px 12px; border-radius: 9px; cursor: pointer; font: 500 14px var(--font); }
.menuitem svg { color: var(--text-3); }
.menuitem:hover, .menuitem[aria-current="page"] { background: var(--surface-2); }
.menusep { height: 1px; background: var(--border); margin: 6px 4px; }

/* ---------- tabs (open checklists) ---------- */
#tabs { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 14px 0; overflow-x: auto; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.tab { display: flex; align-items: center; flex: none; max-width: 240px; border: 1px solid var(--border); border-bottom: 0; border-radius: 10px 10px 0 0; background: var(--surface-2); color: var(--text-2); }
.tab.on { background: var(--bg); color: var(--text); border-color: var(--border-strong); box-shadow: inset 0 2px 0 var(--accent); }
.tabmain { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 6px 8px 12px; background: transparent; border: 0; color: inherit; font: 600 13px var(--font); cursor: pointer; }
.tabtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabprog { font: 600 11px var(--mono); color: var(--text-3); }
.tab.on .tabprog { color: var(--accent); }
.tabx { display: grid; place-items: center; width: 24px; height: 24px; margin-right: 6px; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); cursor: pointer; }
.tabx:hover { background: var(--surface-3); color: var(--text); }
.tabnew { display: grid; place-items: center; flex: none; width: 30px; height: 30px; margin: 0 0 4px 2px; border: 1px dashed var(--border-strong); border-radius: 8px; background: transparent; color: var(--text-3); cursor: pointer; }
.tabnew:hover { color: var(--accent); border-color: var(--accent); }

/* ---------- app shell + panes ---------- */
#app { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.scroll { height: 100%; overflow: auto; padding: 18px 14px 40px; }
.scroll > * { max-width: 980px; margin-left: auto; margin-right: auto; }
.storebanner { margin: 10px 14px 0; }
.stage { position: absolute; inset: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); }
.pane { overflow-y: auto; overflow-x: hidden; min-width: 0; padding: 14px 16px 24px; }
.pane.list { border-right: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 35%, transparent); }
/* wide: the right pane is always visible (empty state, or the checklist fading in). Narrow: it slides in, see the media query. */
.rundetail.anim .detailgrid { animation: rise .26s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- results ---------- */
.hint { color: var(--text-3); font-size: 12.5px; font-weight: 600; margin: 2px 2px 10px; }
.results { display: grid; gap: 8px; align-content: start; }
.result { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%; text-align: left; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px 12px 16px; cursor: pointer; font: inherit; box-shadow: var(--shadow-sm); transition: transform .15s var(--ease), border-color .15s, background .15s, box-shadow .15s; }
.result:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.result b { font-size: 14.5px; letter-spacing: -.01em; }
.result.cur { border-color: var(--accent); }
.result.open { border-color: var(--accent); background: var(--accent-soft); }
.result::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: transparent; }
.result.open::before, .result.cur::before { background: var(--accent); }
.result .best { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; margin-bottom: 3px; }
.result .why { color: var(--good); font-weight: 500; }
.sysrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.sysrow .pill { margin: 0; }

.placeholder { display: grid; place-items: center; align-content: center; text-align: center; min-height: min(72vh, 620px); padding: 40px 16px; color: var(--text-2); }
.placeholder svg.art { margin-bottom: 14px; }
.placeholder h2 { margin-bottom: 6px; }
.placeholder .keys { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 18px; color: var(--text-3); font-size: 12.5px; }
.placeholder .keys span { display: inline-flex; align-items: center; gap: 6px; }
.stage.open .placeholder { display: none; }

/* ---------- checklist detail ---------- */
.detailgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.detailgrid .card { margin-bottom: 0; }
.dhead { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; }
.dtitle { min-width: 0; }
.issue { color: var(--text-2); font-size: 13.5px; font-style: italic; margin: 4px 0 8px; overflow-wrap: anywhere; }
.ring { position: relative; flex: none; display: grid; place-items: center; }
.ring svg { transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-3); }
.ring .meter { transition: stroke-dashoffset .5s var(--ease); }
.ring .rlabel { position: absolute; text-align: center; font: 700 13px/1.1 var(--font); }
.ring .rlabel small { display: block; font: 600 10px var(--font); color: var(--text-3); margin-top: 1px; }
.backbtn { display: none; margin-bottom: 12px; }
.morebar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 12px 0 0; }
.btnchip { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--accent); background: transparent; border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 999px; padding: 4px 11px; font: 600 12px var(--font); transition: background .15s; }
.btnchip:hover { background: var(--accent-soft); }
.srchead { margin: 0; padding: 9px 14px 7px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); background: var(--surface-3); border-bottom: 1px solid var(--border); }

.steps { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); overflow: hidden; }
.step { border-bottom: 1px solid var(--border); transition: background .15s; }
.step:last-child { border-bottom: 0; }
.step .row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 12px 12px 14px; }
.check { flex: none; display: grid; place-items: center; width: 24px; height: 24px; margin-top: 1px; padding: 0; border-radius: 999px; border: 2px solid var(--border-strong); background: transparent; color: transparent; cursor: pointer; transition: all .18s var(--ease); }
.check:hover { border-color: var(--accent); }
.step.done .check { background: var(--good); border-color: var(--good); color: #052e22; animation: pop2 .28s var(--ease); }
.step.fail .check { background: var(--bad); border-color: var(--bad); color: #3a0b11; animation: pop2 .28s var(--ease); }
.step.na .check { background: var(--surface-3); border-color: var(--border-strong); color: var(--text-3); }
@keyframes pop2 { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: none; } }
.stepbody { flex: 1; min-width: 0; cursor: pointer; padding-top: 1px; }
.steptext { overflow-wrap: anywhere; }
.stepnum { color: var(--text-3); font-weight: 600; margin-right: 6px; }
.step.done .steptext { color: var(--text-2); }
.step.done .stepnum { color: var(--good); }
.step.fail { background: var(--bad-soft); }
.step.na .steptext { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--border-strong); }
.stepacts { display: flex; gap: 2px; flex: none; align-items: center; justify-content: flex-end; }
.act { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 7px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--text-3); cursor: pointer; font: 600 12px var(--font); transition: all .15s; }
.act:hover { background: var(--surface-3); color: var(--text); }
.act[aria-pressed="true"].f { color: var(--bad); background: var(--bad-soft); }
.act[aria-pressed="true"].n { color: var(--text); background: var(--surface-3); }
.act.tips[aria-pressed="true"] { color: var(--warn); background: var(--warn-soft); }
.act.tips svg { transition: transform .2s var(--ease); }
.act.tips[aria-pressed="true"] svg { transform: rotate(180deg); }
.trouble { margin: 0 12px 12px 50px; padding: 4px 12px; border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 var(--r-sm) var(--r-sm) 0; animation: rise .2s var(--ease); }
.trouble .t { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; font-size: 13.5px; }
.trouble .t + .t { border-top: 1px dashed color-mix(in srgb, var(--warn) 30%, transparent); }
.trouble .t b { color: var(--text); }
.vcheck { display: flex; gap: 10px; align-items: flex-start; padding: 6px 2px; cursor: pointer; }
.aibar { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px dashed var(--border-strong); border-radius: var(--r-md); padding: 14px 16px; background: linear-gradient(135deg, var(--accent-soft), transparent 60%); }
.aibar.hot { border-color: var(--bad); border-style: solid; background: linear-gradient(135deg, var(--bad-soft), transparent 60%); }
.aibar b { display: flex; align-items: center; gap: 7px; }
.aibar b svg { color: var(--accent); }

/* ---------- notes card ---------- */
.nhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.nhead h3 { margin: 0; }
.tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--good); background: var(--good-soft); padding: 3px 8px; border-radius: 999px; }
pre.notes { margin: 0 0 10px; padding: 14px 16px; min-height: 96px; background: var(--code); border: 1px solid var(--border); border-radius: var(--r-md); font: 13px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
.foot { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 12px 0 2px; margin-top: 12px; background: linear-gradient(to top, var(--bg) 68%, transparent); }
.footinfo { flex: 1; min-width: 0; }
.footinfo .small { font-weight: 600; color: var(--text-2); }

/* ---------- other views ---------- */
.libitem { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 8px; }
.libitem .meta { min-width: 220px; flex: 1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 14px 0; }
.stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 16px; }
.stat b { display: block; font-size: 28px; letter-spacing: -.03em; line-height: 1.1; margin-bottom: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
th { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
tbody tr:hover { background: var(--surface-2); }
.drop { display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; padding: 30px 16px; border: 2px dashed var(--border-strong); border-radius: var(--r-lg); cursor: pointer; background: var(--surface-2); transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { color: var(--accent); }
.preview ul, .preview ol { margin: 4px 0 10px 18px; padding: 0; }
.preview li { margin: 4px 0; }
.tips { margin: 6px 0 14px 18px; padding: 0; color: var(--text-2); }
.tips li { margin: 7px 0; }
.themeseg { margin: 6px 0 4px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 600; box-shadow: var(--shadow-md); z-index: 50; max-width: 92vw; animation: rise .2s var(--ease); }

/* ---------- responsive ---------- */
@media (min-width: 1180px) {
  .stage { grid-template-columns: 330px minmax(0, 1fr); }
  .detailgrid { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
  .notescard { position: sticky; top: 0; }
  .foot { display: none; }
}
@media (max-width: 820px) {
  .stage { display: block; }
  .pane { position: absolute; inset: 0; padding: 12px 12px 20px; }
  .pane.list { border-right: 0; background: transparent; transition: transform .26s var(--ease), opacity .2s; }
  .pane.detail { opacity: 1; transform: translateX(100%); background: var(--bg); transition: transform .26s var(--ease); }
  .stage.open .pane.detail { transform: none; }
  .stage.open .pane.list { transform: translateX(-22%); opacity: 0; pointer-events: none; }
  .backbtn { display: inline-flex; }
  .brandname { display: none; }
  .searchbox .kbd { display: none; }
  .card { padding: 16px; }
  .trouble { margin-left: 12px; }
}
@media (max-width: 520px) { .act span { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
@media print { #top, #tabs, .foot { display: none; } body { background: #fff; color: #000; overflow: visible; } }

.btnrow + p { margin-top: 12px; }

/* Fallbacks for browsers older than Chrome 111 (no color-mix): same look, flat colors */
@supports not (color: color-mix(in srgb, red 50%, blue)) {
  .warnbox { border-color: var(--warn); }
  .panel.ai { border-color: var(--accent); }
  .chip.ok { border-color: var(--good); }
  .chip.warn { border-color: var(--warn); }
  #top { background: var(--surface); }
  #tabs { background: var(--surface-2); }
  .pane.list { background: transparent; }
  .btnchip { border-color: var(--accent); }
  .trouble .t + .t { border-top-color: var(--border-strong); }
}

/* demo build banner */
#demobar { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-bottom: 1px solid var(--border); text-align: center; }
#demobar .demox { display: grid; place-items: center; width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
#demobar .demox:hover { background: var(--surface-3); }

account details\n\nValidation:\n- The user can sign in and completes MFA enrollment\n- Asset tag is recorded in the ticket\n\nTroubleshooting:\n- If the username is already taken, follow the naming standard's tiebreaker rule\n- If the user does not receive the MFA prompt, re-send enrollment and verify the registered email\n\nEscalation:\n- Escalate to Tier 2 if the account cannot be created or group membership will not apply\n","Outlook Not Syncing or Not Receiving Email (Sample)\nCategory: Email\nSystems: Outlook, Exchange\n\nSteps:\n1. Confirm the user can sign in to webmail\n2. Check that Outlook is not in Offline mode and the network is connected\n3. Have the user close and reopen Outlook\n4. Restart the computer if Outlook still shows Disconnected\n5. Create a new Outlook profile and re-add the mailbox\n6. Verify new mail arrives in the desktop client\n\nValidation:\n- New mail appears in Outlook within 5 minutes\n\nTroubleshooting:\n- If webmail also fails, check whether the account is locked or the password expired\n- If the mailbox is full, have the user archive or delete items, then retry\n- If the new profile will not connect, confirm the mailbox exists in Exchange\n\nEscalation:\n- Escalate to the Messaging team if webmail works but Outlook never syncs after a new profile\n","Password Reset and Account Unlock (Sample)\nCategory: Account Access\nSystems: AD, Okta\n\nSteps:\n1. Verify the caller's identity using two identifiers from the approved list\n2. Check whether the AD account is locked, disabled, or expired\n3. Unlock the account in AD if it is locked\n4. Reset the password in AD and require a change at next sign-in\n5. Have the user sign in with the temporary password and set a new one\n6. Add a note to the ticket listing what was done\n\nValidation:\n- The user signs in successfully with the new password\n- The account no longer shows as locked in AD\n\nTroubleshooting:\n- If the account locks again right away, look for a phone, mapped drive, or saved session still using the old password\n- If the new password is rejected, check the password policy for length, complexity, and history\n- If the user cannot get the MFA prompt, re-send the Okta enrollment link\n\nEscalation:\n- Escalate to Tier 2 / Identity team if the account cannot be unlocked or the reset fails after one retry\n","Printer Not Printing (Sample)\nCategory: Hardware\nSystems: Print Server\n\nSteps:\n1. Confirm the printer is powered on and shows no error on its display\n2. Check that the user selected the correct printer\n3. Clear the print queue on the user's computer\n4. Restart the print spooler service\n5. Remove and re-add the printer on the user's computer\n6. Print a test page\n\nValidation:\n- The test page prints\n\nTroubleshooting:\n- If the queue will not clear, restart the print spooler and delete the stuck job\n- If the printer is offline, check its network cable or Wi-Fi connection\n- If only one user is affected, check that user's printer permissions\n\nEscalation:\n- Escalate to Desktop Support if the printer shows a hardware error or is down for everyone\n","VPN Will Not Connect (Sample)\nCategory: Remote Access\nSystems: VPN, Okta\n\nSteps:\n1. Confirm the user has a working internet connection\n2. Verify the user is entering the correct VPN address and username\n3. Check that the user's account is not locked and the password has not expired\n4. Have the user restart the VPN client\n5. Verify the user completes the MFA prompt\n6. Reinstall the VPN client if the error continues\n\nValidation:\n- The VPN shows Connected and the user can reach an internal site\n\nTroubleshooting:\n- If the VPN connects but internal sites do not load, check DNS by having the user disconnect and reconnect\n- If the MFA prompt never arrives, re-send the Okta enrollment link\n- If the user is on hotel or public Wi-Fi, have them switch to a phone hotspot\n\nEscalation:\n- Escalate to Network Support if several users cannot connect at the same time\n"];

          h('button', { class: 'btn primary', disabled: !n, text: 'Save ' + n + ' selected', onclick: function () {
            items.forEach(function (it) { if (it.include && it.res.procedure) saveProcedure(it.res.procedure); });
            saveLib(); ui.batch = null; toast('Saved ' + n + ' procedure' + (n === 1 ? '' : 's')); ui.view = 'library'; render();
          } }),
          h('button', { class: 'btn', text: 'Cancel', onclick: function () { ui.batch = null; render(); } })));
    }

    function save(p, runIt) {
      var existing = lib.filter(function (x) { return x.id === p.id; })[0], out;
      if (existing && confirm('"' + existing.title + '" already exists. OK = replace it, Cancel = keep both.')) {
        out = JSON.parse(JSON.stringify(p)); lib[lib.indexOf(existing)] = out;
      } else { out = saveProcedure(p); }
      saveLib(); ui.importText = ''; ui.preview = null; toast('Saved to library');
      if (runIt) { goOpen(out); } else { ui.view = 'library'; render(); }
    }

    var drop = h('label', { class: 'drop', for: 'file', tabindex: '0',
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); } },
      ondragover: function (e) { e.preventDefault(); drop.classList.add('over'); },
      ondragleave: function () { drop.classList.remove('over'); },
      ondrop: function (e) { e.preventDefault(); drop.classList.remove('over'); loadFiles(e.dataTransfer && e.dataTransfer.files); } },
      h('b', { text: 'Drop files here, or click to choose' }),
      h('span', { class: 'muted small', text: 'Word (.docx), saved web pages (.html), .txt, .md, .json. Select many at once (up to 50).' }));

    wrap.appendChild(h('div', { class: 'card' },
      h('h2', { text: 'Import procedures' }),
      h('p', { class: 'muted', text: 'The app finds the steps, systems, validation, and escalation, writes troubleshooting for each step, and builds the guided workflow. Review before anything is saved. Files are read in your browser and never uploaded.' }),
      drop, fileIn,
      h('h3', { text: 'Or paste the text' }), ta,
      h('div', { class: 'btnrow', style: 'margin-top:10px' },
        h('button', { class: 'btn primary', text: 'Analyze procedure', onclick: analyze }),
        h('button', { class: 'btn', text: 'Paste an example', onclick: function () { ui.importText = EXAMPLE; ta.value = EXAMPLE; analyze(); } }),
        h('button', { class: 'btn', text: 'Download blank template', onclick: function () { download('procedure-template.txt', 'text/plain', TEMPLATE); } })),
      h('p', { class: 'muted small', text: 'Tip: headings like "Steps", "Validation", "Troubleshooting", "Escalation" help. Lines like "If X, do Y" become troubleshooting. No headings? Numbered lists and plain sentences still work. Scanned PDFs and old .doc files: copy the text and paste it.' })));
    wrap.appendChild(previewHost);
    renderPreview();
    return wrap;
  }

  // ---------- history ----------
  function viewHistory() {
    var s = C.stats(history);
    var wrap = h('div', { class: 'card' }, h('h2', { text: 'Outcome history' }),
      h('p', { class: 'muted', text: 'Stored in this browser only. Contains no ticket text.' }));
    wrap.appendChild(h('div', { class: 'stats' },
      stat(s.total, 'Runs logged'), stat(s.total ? Math.round(100 * s.resolved / s.total) + '%' : '–', 'Resolved'),
      stat(s.total ? Math.round(100 * s.escalated / s.total) + '%' : '–', 'Escalated'), stat(s.total ? C.formatDuration(s.avgSecs) : '–', 'Avg time')));
    wrap.appendChild(h('div', { class: 'btnrow', style: 'margin-bottom:12px' },
      h('button', { class: 'btn', disabled: !history.length, text: 'Export CSV', onclick: function () { download('workbench-history.csv', 'text/csv', C.toCSV(history)); } }),
      h('button', { class: 'btn danger', disabled: !history.length, text: 'Clear history', onclick: function () { if (confirm('Delete all history?')) { history = []; saveHist(); render(); } } })));
    if (!history.length) { wrap.appendChild(h('p', { class: 'muted', text: 'No runs yet. Finish a workflow and choose "Save outcome to history".' })); return wrap; }
    var tbl = h('table', null, h('thead', null, h('tr', null, ['When', 'Procedure', 'Validation', 'Outcome', 'Steps', 'Time'].map(function (x) { return h('th', { text: x }); }))));
    var body = h('tbody');
    history.slice().reverse().slice(0, 200).forEach(function (e) {
      body.appendChild(h('tr', null,
        h('td', { text: new Date(e.t).toLocaleString() }), h('td', { text: e.title }), h('td', { text: e.validation === 'success' ? 'Success' : e.validation === 'issue' ? 'Issue remains' : '–' }),
        h('td', { text: C.OUTCOMES[e.outcome] || e.outcome || '' }), h('td', { text: e.done + '/' + e.total }), h('td', { text: C.formatDuration(e.secs) })));
    });
    tbl.appendChild(body);
    wrap.appendChild(h('div', { style: 'overflow-x:auto' }, tbl));
    return wrap;
  }
  function stat(v, l) { return h('div', { class: 'stat' }, h('b', { text: String(v) }), h('span', { class: 'muted small', text: l })); }

  applyTheme();
  buildDemoBar();
  buildTop();
  restoreSession();
  render();
  searchInput.focus();
})();

</script>
</body>
</html>
